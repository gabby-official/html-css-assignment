<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rating Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="rating">
    <div class="rating__icon">★</div>
    <h1 class="rating__title">How did we do?</h1>
    <p class="rating__text">
      Please let us know how we did with your support request.
      All feedback is appreciated to help us improve our offering!
    </p>

    <div class="rating__numbers">
      <button class="rating__number">1</button>
      <button class="rating__number">2</button>
      <button class="rating__number">3</button>
      <button class="rating__number">4</button>
      <button class="rating__number">5</button>
    </div>

    <button class="rating__submit">SUBMIT</button>
  </div>

</body>
</html>
